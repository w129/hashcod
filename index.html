<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hashcod - Cryptographic Platform</title>

  <link rel="icon" type="image/svg+xml" href="app/hashcod-platform-icon.svg?v=hashcod-icon-1" />
  <link rel="apple-touch-icon" href="app/hashcod-platform-icon.svg?v=hashcod-icon-1" />

  <link rel="stylesheet" href="app/styles.css?v=codec-pro-1" />
  <link rel="stylesheet" href="app/vault.css?v=v12-siphash-2" />
  <link rel="stylesheet" href="app/tour.css?v=enterprise-tour-1" />
  <style>
    @font-face{font-family:"Codec Pro";src:local("Codec Pro"),local("Codec Pro Regular"),local("CodecPro"),local("CodecPro-Regular");font-display:swap}
  </style>
</head>
<body>
  <script>
    window.addEventListener('error', function(e){
      console.error('[Hashcod]', e.message, e.error || '');
      var root = document.getElementById('root');
      if(root && !root.dataset.mounted){
        root.innerHTML = '<div class="boot-screen"><div class="boot-card"><div class="boot-logo"><img src="app/hashcod-platform-icon.svg?v=hashcod-icon-1" alt=""><div>Hashcod <span>Cryptographic Platform</span></div></div><div class="boot-text">Error cargando el software. Ejecuta con <b>npm start</b> en localhost y revisa la consola.</div><pre class="boot-error">'+String(e.message).replace(/[<>&]/g,function(c){return {"<":"&lt;",">":"&gt;","&":"&amp;"}[c]})+'</pre></div></div>';
      }
    });
  </script>
  <div id="root">
    <div class="instant-boot" role="status" aria-live="polite">
      <div class="instant-boot-card">
        <img src="app/hashcod-platform-icon.svg?v=hashcod-icon-1" alt="" />
        <div>
          <b>Hashcod</b>
          <span>Opening secure platform...</span>
        </div>
      </div>
    </div>
  </div>

  <!-- React runtime -->
  <script src="vendor/react.production.min.js?v=18.3.1"></script>
  <script src="vendor/react-dom.production.min.js?v=18.3.1"></script>

  <!-- Data layer -->
  <script src="data/icons.js?v=container-icons-1"></script>
  <script src="data/catalog.js"></script>
  <script src="data/generators.js"></script>

  <!-- Security core -->
  <script src="app/security.js"></script>
  <script src="app/enterprise.js?v=enterprise-production-1"></script>

  <!-- Tweaks shell -->
  <script src="app/build/tweaks-panel.js?v=fast-start-1"></script>

  <!-- App -->
  <script src="app/build/tech-info.js?v=fast-start-1"></script>
  <script src="app/build/vault.js?v=fast-start-1"></script>
  <script src="app/build/tour.js?v=fast-start-1"></script>
  <script src="app/build/app.js?v=fast-start-1"></script>

  <script src="app/build/root.js?v=fast-start-1"></script>
  <script async src="vendor/qrcode.min.js?v=1.0.0"></script>
  <script async src="vendor/html2canvas.min.js?v=1.4.1"></script>
</body>
</html>
