<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hashcod - Cryptographic Platform</title>

  <link rel="icon" type="image/svg+xml" href="app/hashcod-platform-icon.svg?v=hashcod-icon-1" />
  <link rel="apple-touch-icon" href="app/hashcod-platform-icon.svg?v=hashcod-icon-1" />

  <link rel="stylesheet" href="app/styles.css?v=codec-pro-1" />
  <link rel="stylesheet" href="app/vault.css?v=v12-siphash-2" />
  <link rel="stylesheet" href="app/tour.css?v=enterprise-tour-1" />
  <style>
    @font-face{font-family:"Codec Pro";src:local("Codec Pro"),local("Codec Pro Regular"),local("CodecPro"),local("CodecPro-Regular");font-display:swap}
    .instant-auth{min-height:100vh;display:grid;place-items:start center;padding:28px 16px;background:linear-gradient(#e8e8e5 1px,transparent 1px),linear-gradient(90deg,#e8e8e5 1px,transparent 1px),#f4f4f1;background-size:32px 32px;color:#f5f5f5;font-family:"Codec Pro","CodecPro","Segoe UI",Arial,sans-serif}
    .instant-card{width:min(1040px,calc(100vw - 42px));max-height:calc(100dvh - 56px);overflow:auto;border:1px solid #2a2a2a;background:radial-gradient(circle at 14% 18%,rgba(245,245,245,.08),transparent 28%),linear-gradient(135deg,#1a1a1a 0%,#101010 58%,#0a0a0a 100%);box-shadow:22px 22px 0 rgba(0,0,0,.22)}
    .instant-hero{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:34px;padding:32px 42px 22px;border-bottom:1px solid #2a2a2a}
    .instant-mark{width:56px;height:56px;display:grid;place-items:center;background:#0f0f0f;border:1px solid #2a2a2a;box-shadow:8px 8px 0 #050505;margin-bottom:14px}.instant-mark svg{width:28px;height:28px}
    .instant-k{display:block;color:#a3a3a3;font-size:10px;letter-spacing:5px;text-transform:uppercase;margin-bottom:14px}.instant-card h1{margin:0 0 12px;font-family:"Codec Pro","CodecPro","Segoe UI",Arial,sans-serif;font-size:clamp(46px,7vw,76px);line-height:1;text-shadow:4px 4px 0 #000}.instant-card p{margin:0;color:#a3a3a3;font-size:14px;line-height:1.55}
    .instant-hand{border:1px solid #2a2a2a;background:linear-gradient(#202020 1px,transparent 1px),linear-gradient(90deg,#202020 1px,transparent 1px),#0f0f0f;background-size:14px 14px;padding:16px;display:grid;gap:10px;align-content:start}.instant-hand b{font-size:11px;letter-spacing:2.4px}.instant-hand span{display:flex;gap:9px;align-items:center;color:#d4d4d4;font-size:11px}.instant-hand i{width:8px;height:8px;background:#f5f5f5;box-shadow:0 0 0 3px rgba(245,245,245,.12)}
    .instant-flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;margin:0 42px 18px;background:#2a2a2a;border:1px solid #2a2a2a}.instant-flow span{background:#141414;padding:12px;text-align:center;color:#f5f5f5;font-size:9px;letter-spacing:2px;text-transform:uppercase}
    .instant-form{display:grid;gap:14px;margin:0 42px 42px}.instant-form input{min-height:58px;border:1px solid #2a2a2a;background:#0f0f0f;color:#f5f5f5;padding:0 14px;font:14px "Codec Pro","CodecPro","Segoe UI",Arial,sans-serif}.instant-form button{min-height:60px;border:1px solid #f5f5f5;background:#f5f5f5;color:#0f0f0f;font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase}.instant-status{display:none;border-left:4px solid #18884f;background:rgba(24,136,79,.12);color:#9ee6bd;padding:10px 12px;font-size:12px}
    @media(max-width:760px){.instant-card{width:calc(100vw - 24px);max-height:calc(100dvh - 24px)}.instant-hero{grid-template-columns:1fr;padding:24px 18px 18px}.instant-flow{grid-template-columns:1fr 1fr}.instant-flow,.instant-form{margin-left:18px;margin-right:18px}.instant-card h1{font-size:clamp(42px,17vw,64px)}}
  </style>
</head>
<body>
  <script>
    window.addEventListener('error', function(e){
      console.error('[Hashcod]', e.message, e.error || '');
      var root = document.getElementById('root');
      if(root && !root.dataset.mounted){
        root.innerHTML = '<div class="boot-screen"><div class="boot-card"><div class="boot-logo"><img src="app/hashcod-platform-icon.svg?v=hashcod-icon-1" alt=""><div>Hashcod <span>Cryptographic Platform</span></div></div><div class="boot-text">Error cargando el software. Ejecuta con <b>npm start</b> en localhost y revisa la consola.</div><pre class="boot-error">'+String(e.message).replace(/[<>&]/g,function(c){return {"<":"&lt;",">":"&gt;","&":"&amp;"}[c]})+'</pre></div></div>';
      }
    });
  </script>
  <div id="root">
    <div class="instant-auth">
      <form class="instant-card" id="instant-login">
        <div class="instant-hero">
          <div>
            <div class="instant-mark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M8 12h8"/><path d="M10 11v2"/><path d="M8 17h8"/><path d="M14 16v2"/></svg></div>
            <span class="instant-k">HASHCOD IDENTITY PLATFORM</span>
            <h1>Login</h1>
            <p>Sesion segura con cookie HttpOnly, CSRF, rate limiting, OAuth 2.0 y roles.</p>
          </div>
          <aside class="instant-hand">
            <b>SESSION HANDSHAKE</b>
            <span><i></i> HTTP-only cookie</span>
            <span><i></i> CSRF token ready</span>
            <span><i></i> Rate limit guard</span>
            <span><i></i> Server identity check</span>
          </aside>
        </div>
        <div class="instant-flow"><span>01 csrf</span><span>02 credentials</span><span>03 secure session</span><span>04 contract gate</span></div>
        <div class="instant-form">
          <input type="email" placeholder="Email" autocomplete="email" />
          <input type="password" placeholder="Password" autocomplete="current-password" />
          <div class="instant-status">Cargando plataforma segura...</div>
          <button type="submit">Unlock Platform</button>
        </div>
      </form>
    </div>
  </div>
  <script>
    (function(){
      var form = document.getElementById('instant-login');
      if(!form) return;
      form.addEventListener('submit', function(e){
        e.preventDefault();
        var status = form.querySelector('.instant-status');
        var email = form.querySelector('input[type="email"]');
        var password = form.querySelector('input[type="password"]');
        if(status) {
          status.style.display = 'block';
          status.textContent = 'Verificando credenciales...';
        }
        fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email && email.value, password: password && password.value })
        }).then(function(res){
          return res.json().then(function(data){ return { ok: res.ok && data.ok, data: data }; });
        }).then(function(result){
          if(result.ok) {
            if(status) status.textContent = 'Sesion creada. Abriendo Hashcod...';
            location.reload();
          } else if(status) {
            status.textContent = 'Login invalido. Espera la interfaz completa si necesitas solicitar acceso.';
          }
        }).catch(function(){
          if(status) status.textContent = 'Servidor despertando. La interfaz completa aparecera en breve.';
        });
      });
    })();
  </script>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <!-- Data layer -->
  <script src="data/icons.js?v=container-icons-1"></script>
  <script src="data/catalog.js"></script>
  <script src="data/generators.js"></script>

  <!-- Security core -->
  <script src="app/security.js"></script>
  <script src="app/enterprise.js?v=enterprise-production-1"></script>

  <!-- Tweaks shell -->
  <script type="text/babel" src="tweaks-panel.jsx"></script>

  <!-- App -->
  <script type="text/babel" src="app/tech-info.jsx?v=right-info-v2"></script>
  <script type="text/babel" src="app/vault.jsx?v=v12-siphash-2"></script>
  <script type="text/babel" src="app/tour.jsx?v=enterprise-tour-1"></script>
  <script type="text/babel" src="app/app.jsx?v=identity-platform-1"></script>

  <script type="text/babel">
    const Root = () => {
      React.useEffect(() => { document.getElementById('root')?.setAttribute('data-mounted','1'); }, []);
      const [tourOpen, setTourOpen] = React.useState(false);
      const [enterprise, setEnterprise] = React.useState({ ready: false, status: null });
      React.useEffect(() => {
        let alive = true;
        (async () => {
          if (!window.OCGEnterprise) {
            setEnterprise({ ready: true, status: { ok: false, failed: [{ id: 'enterprise-module-missing', detail: 'app/enterprise.js not loaded' }] } });
            return;
          }
          const status = await window.OCGEnterprise.runSelfTests();
          if (alive) setEnterprise({ ready: true, status });
        })();
        return () => { alive = false; };
      }, []);
      React.useEffect(() => {
        window.__startTour = () => {
          if (window.resetTourSeen) window.resetTourSeen();
          setTourOpen(true);
        };
        return () => { delete window.__startTour; };
      }, []);
      React.useEffect(() => {
        if (enterprise.ready && enterprise.status?.ok && window.AppTour && !window.hasSeenTour?.()) {
          setTimeout(() => setTourOpen(true), 420);
        }
      }, [enterprise.ready, enterprise.status?.ok]);
      if (enterprise.ready && !enterprise.status?.ok) {
        return <div className="boot-screen"><div className="boot-card"><div className="boot-logo"><img src="app/hashcod-platform-icon.svg?v=hashcod-icon-1" alt="" /><div>Hashcod <span>Cryptographic Platform</span></div></div><div className="boot-text">Enterprise gate bloqueó el arranque. Revisa los self-tests fallidos.</div><pre className="boot-error">{JSON.stringify(enterprise.status?.failed || [], null, 2)}</pre></div></div>;
      }

      const PlatformApp = window.App;
      return <>
        <PlatformApp />
        {window.AppTour ? <AppTour active={tourOpen} onClose={() => setTourOpen(false)} /> : null}
      </>;
    };
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<Root />);
  </script>
</body>
</html>
